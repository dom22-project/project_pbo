{% extends "base.html" %}

{% block title %}Tambah Tindakan{% endblock %}

{% block content %}
<div class="container">
    <!-- Header -->
    <div class="row mb-4">
        <div class="col-12">
            <h1 class="display-5">
                <i class="bi bi-plus-circle"></i> Tambah Tindakan Baru
            </h1>
            <p class="text-muted">Form untuk menambah data tindakan baru</p>
        </div>
    </div>

    <!-- Form -->
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0"><i class="bi bi-file-earmark-plus"></i> Form Tindakan</h5>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nama Tindakan <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="nama_tindakan" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Kelas <span class="text-danger">*</span></label>
                        <select class="form-select" name="kelas" required>
                            <option value="">-- Pilih Kelas --</option>
                            <option value="BASIC">BASIC</option>
                            <option value="STANDARD">STANDARD</option>
                            <option value="DELUXE">DELUXE</option>
                            <option value="VIP">VIP</option>
                            <option value="VVIP">VVIP</option>
                            <option value="SUITE">SUITE</option>
                            <option value="PRESIDENTIAL SUITE">PRESIDENTIAL SUITE</option>
                            <option value="ODC">ODC</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Kategory <span class="text-danger">*</span></label>
                        <select class="form-select" name="kategory" required>
                            <option value="">-- Pilih Kategory --</option>
                            <option value="Konsultasi">Konsultasi</option>
                            <option value="Diagnostic Pre Tindakan">Diagnostic Pre Tindakan</option>
                            <option value="Diagnostic">Diagnostic</option>
                            <option value="Medical Equipment">Medical Equipment</option>
                            <option value="Obat">Obat</option>
                            <option value="Obat dan Alkes">Obat dan Alkes</option>
                            <option value="Alat">Alat</option>
                            <option value="Recovery">Recovery</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Sales Item Type</label>
                        <input type="text" class="form-control" name="sales_item_type">
                    </div>
                    <div class="col-md-12 mb-3">
                        <label class="form-label">Harga (Amount) <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" name="amount" min="0" step="1000" required>
                    </div>
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                    <a href="{{ url_for('view_tindakan') }}" class="btn btn-secondary">
                        <i class="bi bi-x-circle"></i> Batal
                    </a>
                    <button type="reset" class="btn btn-warning">
                        <i class="bi bi-arrow-counterclockwise"></i> Reset
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save"></i> Simpan
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
